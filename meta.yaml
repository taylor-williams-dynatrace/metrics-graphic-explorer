title: "Dynatrace Canvases"
description: Dynatrace Canvases is a Dynatrace app for building custom, visual monitoring views. Instead of standard dashboards with fixed grid layouts, it lets you place live data tiles anywhere you want on top of a background of your choosing, turning things like an architecture diagram, network map, floor plan, or process flow into a live status board.>

purpose: Display a dynamic, visual representation of your environment and its health, using live tiles that can be placed anywhere on a background of your choosing. Canvases is designed to be used in a variety of ways, from monitoring dashboards to status boards to custom visualizations.>

