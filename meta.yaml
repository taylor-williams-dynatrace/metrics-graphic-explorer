setup_instructions: Standard Dynatrace app installation instructions apply. After installation, you can access the app from the Dynatrace menu. Search for "Canvases" to find the app. Once inside, you can create a new canvas or open an existing one. You can add tiles to your canvas by selecting the "Add Tile" button and choosing from a variety of tile types, including metrics, logs, and custom HTML. You can also customize the appearance of your canvas by changing the background image, adding text labels, and adjusting the layout of your tiles.>

